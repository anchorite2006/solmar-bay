<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #87b5d6; font-family: Verdana, Geneva, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 14px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; z-index: 5; }
  #hud h1 { margin: 0; font-size: 26px; letter-spacing: 2px; font-style: italic; color: #ffe9a8; }
  #hud .sub { font-size: 12px; opacity: .9; margin-top: 2px; }
  #hud .pos { font-size: 12px; margin-top: 8px; font-family: monospace; }
  #hint { position: fixed; bottom: 12px; left: 14px; color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; z-index: 5; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 24, 44, .55); color: #fff; z-index: 10; cursor: pointer; text-align: center; }
  #overlay h1 { font-size: 64px; margin: 0; font-style: italic; letter-spacing: 4px; color: #ffe9a8; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
  #overlay p { font-size: 16px; margin: 10px 0 0; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #overlay .go { margin-top: 26px; font-size: 20px; font-weight: bold; border: 2px solid #ffe9a8; border-radius: 8px; padding: 10px 28px; }
  #overlay.hidden { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>SOLMAR BAY</h1>
  <div class="sub">M1 baseline &middot; an original open-world crime game</div>
  <div class="pos" id="pos">x 0.0 &nbsp; z 0.0</div>
</div>
<div id="hint">WASD / arrows &mdash; walk &nbsp;&middot;&nbsp; drag mouse &mdash; orbit camera &nbsp;&middot;&nbsp; Shift &mdash; run</div>
<div id="overlay">
  <h1>SOLMAR BAY</h1>
  <p>A sun-soaked seaside city. Walk its streets. The rest of the story comes later.</p>
  <div class="go">CLICK TO START</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
